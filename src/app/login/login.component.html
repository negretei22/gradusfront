<div class="login-container">
  <div class="login-card">
    <!-- Logo GRADUS (sin fondo, filtrado a verde) -->
    <div class="logo-container">
      <img src="https://gradus.com.mx/wp-content/uploads/2024/07/LOGO-BLANCO-1080x.png" alt="GRADUS" />
    </div>
    
    <h2>Bienvenido</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="admin@gradus.com.mx" />
        <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Email inválido
        </small>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="••••••" />
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Mínimo 4 caracteres
        </small>
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>

      <button type="submit" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Cargando...' : 'Entrar' }}
      </button>
    </form>

    <div class="login-footer">Sistema GRADUS © 2026</div>
  </div>
</div>
